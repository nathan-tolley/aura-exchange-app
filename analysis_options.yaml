# Static analysis for the app. `flutter analyze` must stay clean (CLAUDE.md).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - ios/**
    - web/**
    # The handoff's copy of the tokens; lib/design/tokens.dart is the one in use.
    - design/**
    # swagger_parser and json_serializable output: regenerated, never edited.
    - lib/api/generated/**
    - "**/*.g.dart"
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
